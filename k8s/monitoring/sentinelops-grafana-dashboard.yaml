apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelops-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1" # Automatically scanned and imported by Grafana sidecar
    app.kubernetes.io/part-of: sentinelopsai
data:
  sentinelops-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Application Throughput & Latency",
          "type": "row"
        },
        {
          "title": "HTTP Request Throughput (req/sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "id": 1,
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 15 },
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"sentinelopsai\"}[1m])) by (status_code, route)",
              "legendFormat": "{{route}} [{{status_code}}]",
              "refId": "A"
            }
          ]
        },
        {
          "title": "P95 Request Duration (Latency)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "id": 2,
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "smooth", "fillOpacity": 15 },
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"sentinelopsai\"}[5m])) by (le))",
              "legendFormat": "P95 Latency",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 101,
          "title": "Resilience & Anomaly Metrics (OOM & Crashes)",
          "type": "row"
        },
        {
          "title": "Backend Pod Working Set Memory (200Mi Limit)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 16, "x": 0, "y": 10 },
          "id": 3,
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 20,
                "thresholdsStyle": { "mode": "line" }
              },
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 188743680 },
                  { "color": "red", "value": 209715200 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"sentinelopsai\", container=\"backend\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Backend Pod Restarts (Last 1h)",
          "type": "stat",
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 10 },
          "id": 4,
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "increase(kube_pod_container_status_restarts_total{namespace=\"sentinelopsai\", container=\"backend\"}[1h])",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["sentinelops", "sre", "kubernetes"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m"]
      },
      "timezone": "browser",
      "title": "SentinelOpsAI — SRE Observability Dashboard",
      "uid": "sentinelops-sre-dash",
      "version": 1
    }
