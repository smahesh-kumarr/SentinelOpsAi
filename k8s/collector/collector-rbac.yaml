apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector-sa
  namespace: sentinelopsai
  labels:
    app: collector-service
    app.kubernetes.io/part-of: sentinelopsai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: collector-reader
  namespace: sentinelopsai
  labels:
    app: collector-service
    app.kubernetes.io/part-of: sentinelopsai
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: collector-reader-binding
  namespace: sentinelopsai
  labels:
    app: collector-service
    app.kubernetes.io/part-of: sentinelopsai
subjects:
  - kind: ServiceAccount
    name: collector-sa
    namespace: sentinelopsai
roleRef:
  kind: Role
  name: collector-reader
  apiGroup: rbac.authorization.k8s.io
