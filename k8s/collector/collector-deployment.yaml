apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-service
  namespace: sentinelopsai
  labels:
    app: collector-service
    app.kubernetes.io/part-of: sentinelopsai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector-service
  template:
    metadata:
      labels:
        app: collector-service
    spec:
      serviceAccountName: collector-sa # Grants in-cluster read-only access to K8s API
      containers:
        - name: collector-service
          image: maheshkumars772/sentinelops-collector-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PROMETHEUS_URL
              value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
            - name: LOKI_URL
              value: "http://loki.monitoring.svc.cluster.local:3100"
            - name: MONGODB_URI
              value: "mongodb://mongodb.sentinelopsai.svc.cluster.local:27017/sentinelops"
            - name: MONGODB_DB_NAME
              value: "sentinelops"
            - name: K8S_NAMESPACE
              value: "sentinelopsai"
            - name: POLL_INTERVAL_SECONDS
              value: "30"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
