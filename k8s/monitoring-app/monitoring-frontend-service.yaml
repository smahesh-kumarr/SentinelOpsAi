apiVersion: v1
kind: Service
metadata:
  name: monitoring-frontend
  namespace: sentinelopsai
  labels:
    app: monitoring-frontend
    app.kubernetes.io/part-of: sentinelopsai
spec:
  type: NodePort
  selector:
    app: monitoring-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30090
