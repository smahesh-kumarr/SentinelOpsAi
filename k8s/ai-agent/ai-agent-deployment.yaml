apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: sentinelopsai
  labels:
    app: ai-agent
    app.kubernetes.io/part-of: sentinelopsai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      serviceAccountName: ai-agent-sa
      containers:
        - name: ai-agent
          image: maheshkumars772/sentinelops-ai-agent:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb.sentinelopsai.svc.cluster.local:27017/sentinelops"
            - name: MONGODB_DB_NAME
              value: "sentinelops"
            - name: AGENT_POLL_INTERVAL_SECONDS
              value: "15"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
