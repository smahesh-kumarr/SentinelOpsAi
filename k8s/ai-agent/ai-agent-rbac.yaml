apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-sa
  namespace: sentinelopsai
  labels:
    app: ai-agent
    app.kubernetes.io/part-of: sentinelopsai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-role
  namespace: sentinelopsai
  labels:
    app: ai-agent
    app.kubernetes.io/part-of: sentinelopsai
rules:
  # Deployments: rolling restart, scaling, rollout undo
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Pods: readiness verification and eviction
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch", "delete"]

  # NetworkPolicies: zero-trust pod quarantine isolation
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-rb
  namespace: sentinelopsai
  labels:
    app: ai-agent
    app.kubernetes.io/part-of: sentinelopsai
subjects:
  - kind: ServiceAccount
    name: ai-agent-sa
    namespace: sentinelopsai
roleRef:
  kind: Role
  name: ai-agent-role
  apiGroup: rbac.authorization.k8s.io
